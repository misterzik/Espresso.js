name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - development
      - dev

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=optional
      
      - name: Run tests
        run: npm test
      
      - name: Check for security vulnerabilities
        run: npm audit --production --audit-level=moderate
        continue-on-error: true
  
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=optional
      
      - name: Validate configuration
        run: node cli validate
      
      - name: Check package.json
        run: |
          if ! jq empty package.json 2>/dev/null; then
            echo "❌ package.json is not valid JSON"
            exit 1
          fi
          echo "✅ package.json is valid"
      
      - name: Check for outdated dependencies
        run: npm outdated || true
        continue-on-error: true
  
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=optional
      
      - name: Verify package can be packed
        run: |
          npm pack --dry-run
          echo "✅ Package can be built successfully"
      
      - name: Check package size
        run: |
          SIZE=$(npm pack --dry-run 2>&1 | grep "package size" | awk '{print $4}')
          echo "📦 Package size: $SIZE"
          if [ ! -z "$SIZE" ]; then
            echo "✅ Package size check passed"
          fi
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=optional
      
      - name: Run security audit
        run: npm audit --production
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for security vulnerabilities..."
          npm audit --json > audit.json || true
          
          CRITICAL=$(cat audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit.json | jq '.metadata.vulnerabilities.high // 0')
          
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
          
          if [ "$HIGH" -gt 5 ]; then
            echo "⚠️  Warning: $HIGH high vulnerabilities found"
          fi
          
          echo "✅ Security check passed"
  
  compatibility:
    name: Compatibility Check
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=optional
      
      - name: Run tests
        run: npm test
      
      - name: Test CLI commands
        run: |
          node cli validate
          node cli show
          node cli version

  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR info
        run: |
          echo "📋 Pull Request Information"
          echo "Branch: ${{ github.head_ref }} → ${{ github.base_ref }}"
          echo "Author: ${{ github.actor }}"
          echo "Commits: $(git rev-list --count ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})"
          
      - name: Check commit messages
        run: |
          echo "📝 Recent commit messages:"
          git log --oneline -5
          
      - name: Files changed
        run: |
          echo "📁 Files changed in this PR:"
          git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, build, security, compatibility]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "🎯 CI Pipeline Summary"
          echo "======================"
          echo "Test: ${{ needs.test.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Compatibility: ${{ needs.compatibility.result }}"
          
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.compatibility.result }}" != "success" ]; then
            echo "❌ Some checks failed!"
            exit 1
          fi
          
          echo "✅ All checks passed!"
