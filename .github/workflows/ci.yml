name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - development
      - dev

jobs:
  # Fast comprehensive check on Node 18 & 20
  test:
    name: Test & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=optional
      
      - name: Validate configuration
        run: node cli validate
      
      - name: Run tests
        run: npm test
      
      - name: Check package can be built
        run: npm pack --dry-run
      
      - name: Security audit (critical only)
        run: npm audit --production --audit-level=critical
        continue-on-error: true
